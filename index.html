<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Main Menu</title>
<style>
@font-face{font-family:MenuI;src:url(fonts/Inter-BlackItalic.otf)}
@font-face{font-family:Title;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:UiBI;src:url(fonts/Inter-BoldItalic.otf)}
@font-face{font-family:UiLI;src:url(fonts/Inter-LightItalic.otf)}
@font-face{font-family:UiXLI;src:url(fonts/Inter-ExtraLightItalic.otf)}
@font-face{font-family:Hint;src:url(fonts/Kanit-MediumItalic.ttf)}
@font-face{font-family:HintR;src:url(fonts/Kanit-Italic.ttf)}
@font-face{font-family:HintB;src:url(fonts/Kanit-SemiBoldItalic.ttf)}
@font-face{font-family:HintL;src:url(fonts/Kanit-SemiBold.ttf)}
@font-face{font-family:Num;src:url(fonts/BodoniModa.ttf)}
@font-face{font-family:Row;src:url(fonts/AlegreyaSans-Medium.ttf)}
@font-face{font-family:RowB;src:url(fonts/AlegreyaSans-Bold.ttf)}
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
/* the picture is always laid out as 1920x1080 and stretched to whatever size the TV gives the page */
canvas{display:block;width:100vw;height:100vh}
#home-motion{position:absolute;inset:0;transform-origin:17.1875% 75.925926%;pointer-events:none}
#c{position:relative}
/* a second canvas lies over the first only while the opening foam plays (the graphics chip draws it) */
#fx{position:absolute;left:0;top:0;pointer-events:none}
/* while an HDMI source is on screen the TV draws it behind the page, so the page gets out of the way */
html.through,html.through body{background:transparent}
html.through canvas{visibility:hidden}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="assets/home-frames/index.js"></script>
<script src="assets/home-frames/damage.js"></script>
<script src="assets/home-motion.js"></script>
<script src="app.js"></script>
</body>
</html>
